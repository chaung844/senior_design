services:
    db:
        image: postgres:16
        container_name: matcha_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: matcha_db
        ports:
            - "5434:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    # comment out backend docker build for local backend dev. Only compose db.
