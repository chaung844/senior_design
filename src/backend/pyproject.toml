[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3",
    "slowapi>=0.1.9",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "boto3>=1.42.46",
    "fastapi>=0.128.7",
    "greenlet>=3.3.1",
    "httptools>=0.7.1",
    "openai>=2.20.0",
    "pandas>=3.0.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.9",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.11.0",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
    "uvloop>=0.22.1",
    "rapidfuzz>=3.14.3",
    "rich>=14.3.3",
    "scipy>=1.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Ignore "F401" (unused imports) in all files inside the alembic folder
"alembic/env.py" = ["F401"]
"alembic/versions/*" = ["F401"]

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "pytest>=8.0.0",
]
